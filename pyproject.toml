[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "DataForge"
version = "0.1.0"
description = "Personal Data Cleaning Flow"

dependencies = [
    "pandas",
    "openpyxl",
    "xlsxwriter",
    "rapidfuzz",
    "ftfy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataforge"]
namespaces = false
